# Checks every push and pull request before Vercel's deploy goes live.
# Vercel builds and deploys on its own (through its GitHub integration); this
# only catches mistakes. It needs no secrets: the app builds in sample mode,
# and OpenRouter's model list is public. Never add OPENROUTER_API_KEY here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a model OpenRouter retires shows up before drafts break.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Type-check, lint and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  models:
    name: Writing models still on OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:models
